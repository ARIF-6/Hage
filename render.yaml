services:
  - type: web
    name: hage-backend
    env: node
    plan: free
    rootDir: Hage/backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false
      - key: ADMIN_EMAIL
        value: omardahir379@gmail.com
      - key: ADMIN_PASSWORD
        value: omar123
      - key: SMTP_SERVICE
        value: gmail
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: FRONTEND_URL
        value: https://hagejournal.netlify.app
